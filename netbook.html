Date.prototype.format = function (fmt) {var o = {"M+": this.getMonth() + 1,"d+": this.getDate(),"H+": this.getHours(),"m+": this.getMinutes(),"s+": this.getSeconds(),"q+": Math.floor((this.getMonth() + 3) / 3),"S": this.getMilliseconds() };if (/(y+)/.test(fmt)) {fmt = fmt.replace(RegExp.$1, (this.getFullYear() + "").substr(4 - RegExp.$1.length));}for (var k in o) {if (new RegExp("(" + k + ")").test(fmt)) {fmt = fmt.replace(RegExp.$1, (RegExp.$1.length == 1) ? (o[k]) : (("00" + o[k]).substr(("" + o[k]).length)));}}return fmt;};
var S=new (function(){
			this.getTime=function(){return new Date().format("HH:mm:ss");};

			this.loadScript=function (src) {
				return new Promise((resolve, reject) => {
					// 防止重复加载
					if (document.querySelector(`script[src="${src}"]`)) {
						resolve();
						return;
					}
					const script = document.createElement('script');
					script.src = src;
					script.onload = () => resolve();
					script.onerror = () => reject(new Error(`加载失败: ${src}`));
					document.head.appendChild(script);
				});
			};

			this.showTextareaModal=function (i, s) {

				// 3. 创建 textarea

				// 4. 创建按钮容器
				const buttonContainer = document.createElement('div');
				buttonContainer.style.padding = '12px 16px';
				buttonContainer.style.display = 'flex';
				buttonContainer.style.justifyContent = 'flex-end';
				buttonContainer.style.gap = '10px';

				// 5. 关闭按钮
				const closeButton = document.createElement('button');
				closeButton.textContent = '关闭';
				closeButton.style.padding = '6px 12px';
				closeButton.style.border = '1px solid #ccc';
				closeButton.style.backgroundColor = '#f0f0f0';

				closeButton.style.cursor = 'pointer';
				closeButton.style.fontSize = '14px';
				closeButton.onclick = () => {
					document.body.removeChild(overlay);
				};

				// 6. 提交按钮
				const submitButton = document.createElement('button');
				submitButton.textContent = '提交';
				submitButton.style.padding = '6px 12px';
				submitButton.style.border = '1px solid #4CAF50';

				submitButton.style.cursor = 'pointer';
				submitButton.style.fontSize = '14px';
				
				submitButton.onclick = () => {
					const value = textarea.value;
					if(s && typeof s==="function") s(value); // 执行回调

				buttonContainer.appendChild(closeButton);

			this.listIndexedDBDatabases=async function () {
				if (!window.indexedDB) {
					console.log("当前浏览器不支持 IndexedDB");
					return [];
				}

				// 检查是否支持 indexedDB.databases()
				if (typeof indexedDB.databases === 'function') {
					try {
						const databases = await indexedDB.databases();
						console.log(`当前 origin 下共有 ${databases.length} 个 IndexedDB 数据库：`);
						let result=[];
						databases.forEach((db, index) => {
							console.log(`${index + 1}. 名称: "${db.name}", 版本: ${db.version}`);
							if(db.name!=_sys_db_name)result.push(db.name);
						});
						return result;//databases.map(db => db.name);
					} catch (error) {
						console.error("获取数据库列表失败:", error);
						return [];
					}
				} else {
					console.warn("当前浏览器不支持 indexedDB.databases() 方法，无法列出数据库。");
					// 可选：提示用户手动输入数据库名或使用其他方式
					return [];
				}
			};
					
			// 全局变量
			this._db={};
			this._lastDb;
			this._sys_db_name="_sys_db_name_";

			// 初始化IndexedDB
			this.initDB=function (dbName,successCallBack,upgradeCallBack) {
				const request = indexedDB.open(dbName, 3);
				let that=this;
				request.onerror = function(event) {
					console.error('数据库打开失败:', event.target.error);
				};
				request.onsuccess = function(event) {
					that._db[dbName] = event.target.result;
					that._lastDb=event.target.result;
					if(typeof successCallBack=="function"){
						successCallBack(that._lastDb);
					}
				};
				request.onupgradeneeded = function(event) {
					that._db[dbName] = event.target.result;
					that._lastDb=event.target.result;
					if(typeof upgradeCallBack=="function"){
						upgradeCallBack(that._lastDb);
					}
				};
			};
			this.getDb=function (dbName){if(dbName){return this._db[dbName];}else{ return this._lastDb;}};
			this.getSrc=function (limit){
				 if(limit==null || typeof limit =="undefined"||limit==0)limit=0;
				 else if(!limit)limit=1;
				 let that=this;
				 return new Promise((resolve, reject) => {
					 that.initDB(that._sys_db_name,(__db)=>{
									const store = __db.transaction('sys', 'readonly').objectStore('sys');
									const cursorRequest = store.openCursor(null, 'prev'); // 自动按 id 降序
									const results = [];
									cursorRequest.onsuccess = (e) => {
										const cursor = e.target.result;
										 if(limit==0){
											 resolve(cursor?cursor.value:null);
										} 
										 if (cursor &&(limit==-1|| results.length<limit)) {
											results.push(cursor.value);
											cursor.continue();
										} else {
											resolve(results);
										}
									};
									
								},(__db)=>{
								if (!__db.objectStoreNames.contains('sys')) {
									const sysStore = __db.createObjectStore('sys', { keyPath: 'id', autoIncrement: true });
									sysStore.createIndex('html', 'html', { unique: false });
								}
					 });
				 });
			};
			this.setSrc=function (_html,_js){
				let that=this;
				 return new Promise((resolve, reject) => {
					const  transaction = that.getDb(that._sys_db_name).transaction(['sys'],'readwrite');
					const store = transaction.objectStore('sys');
					const html_src = { html: _html,js: _js, createdAt: new Date() };
					const request = store.add(html_src);
					request.onsuccess = function() {
					   console.log("更新成功");
					   resolve(true);
					};
					request.onerror = function() {
						console.log("更新失败");
						resolve(false);
					};
				});
			};
			this.fetch=function (url, options = {}) {
			  return new Promise((resolve, reject) => {
				const requestId = Date.now().toString() + Math.random().toString(36).substr(2, 9);
				
				const handleMessage = (event) => {
				  const data = event.data;
				  if (data && data.type === 'CROSS_ORIGIN_FETCH_RESPONSE' && 
					  data.requestId === requestId) {
					window.removeEventListener('message', handleMessage);
					if (data.success) {
					  resolve(data.data.data);
					} else {
					  reject(new Error(data.error));
					}
				  }
				};
				
				window.addEventListener('message', handleMessage);
				
				window.postMessage({
				  type: 'CROSS_ORIGIN_FETCH',
				  requestId: requestId,
				  url: url,
				  options: options
				}, '*'); // 前端始终使用 '*' 
				
				setTimeout(() => {
				  window.removeEventListener('message', handleMessage);
				  reject(new Error('Request timeout'));
				}, 10000);
			  });
		};
		
		this.toJson=function(str){
			if(typeof str=="string"){
				try{str=JSON.parse(str);}catch(e){  try{str=eval("str="+str);}catch(e2){} }
			}
			return str;
		};
		this.http=async function (url ,config){
			return new Promise((resolve, reject) => {
				 try {
						let requestOptions={};
						let timeout=10000;
						if(typeof config==="number"){
							timeout=config;
						}else if(config){
							timeout=config.timeout||10000;
							requestOptions = {
							  method: config.method || 'GET',
							  headers: config.headers || {},
							  ...config
							};
							// 移除可能引起问题的属性
							delete requestOptions.url;
							delete requestOptions.action;
							delete requestOptions.timeout;
						}
						if(!url || url.trim().length<1)resolve("");
						setTimeout(() => { reject(new Error('Request timeout')); }, timeout);
						fetch(url,requestOptions)
						.then((response) => {
								if(response.data)resolve(response.data);
								else {
									response.text().then((data)=>{
										resolve(data);
									});
								}
						})
						.catch((error) => reject(error));
					} catch (error) {
						reject(error);
					}
			});
		};
		this.post=this.get=async function (url ,config){
			let result= await this.http(url,config);
			if(!result)return result;
			if(result.stack && result.name &&result.name.toLowerCase()=="error") return result.message;
			return result;
		};
		this.postJson=this.getJson=async function (url ,config){
			let result= await this.http(url,config);
			if(!result)return {result:result};
			if(result.stack && result.name &&result.name.toLowerCase()=="error") return  {result:result.message};
			if(typeof result=="string"){
				result=this.toJson(result);
			}
			return result;
		};

	    this.sleep=function(ms) {
         return new Promise(resolve => setTimeout(resolve, ms));
        }
		})();
	if(document.location.origin=="file://") window.fetch=S.fetch;

    <script>
	let iframes={};
	let editor;
	let currentNote = null;
	let isEditing = false;
	let isNavCollapsed = false;
	let isDarkMode = false;
	let pendingNavigation = null;
	let deletePending = null;
	let renamingNode = null;
	let groupStates = {}; // 记录分组折叠状态
	let clickTimer = null;
	let clickCount = 0;
	let spaceCharWidth=-1;
	let isSourceMode = false;
	let initialContent = ''; // 用于跟踪初始内容
	function init(){
        // 初始化应用
            initWangEditor();
            updateDateTime();
            setInterval(updateDateTime, 1000);
            // 从localStorage恢复最后的状态
            const savedNoteId = localStorage.getItem('lastActiveNoteId');
            if (savedNoteId) {
                lastActiveNoteId = parseInt(savedNoteId);
            }
            // 恢复分组折叠状态
            const savedGroupStates = localStorage.getItem('groupStates');
            if (savedGroupStates) {
                groupStates = JSON.parse(savedGroupStates);
            }
            // 恢复主题设置
            const savedTheme = localStorage.getItem('notebookTheme');
            if (savedTheme === 'dark') {
                isDarkMode = true;
                document.body.classList.add('dark-mode');
                const themeBtn = document.querySelector('.dropdown-content a:first-child');
                if (themeBtn) {
                    themeBtn.innerHTML = '☀️ 白天模式';
                }
            }
            // 点击其他地方关闭下拉菜单
            document.addEventListener('click', function(e) {
                if (!e.target.closest('.dropdown')) {
                    closeSettingsDropdown();
                }
                if (!e.target.closest('.export-dropdown')) {
                    closeExportDropdown();
                }
            });
            // 添加快捷键监听
            document.addEventListener('keydown', function(e) {
                // Ctrl+S 保存
                if (e.ctrlKey && e.key === 's') {
                    e.preventDefault();
                    saveCurrentNote();
                }else if (e.ctrlKey && e.keyCode === 13) {
                    e.preventDefault();
                    runJs(); 
                } 
            });
			S.getSrc().then((a)=>{
				if(a && a.js){
					try{ eval(a.js); }catch(e){ console.error(e); }
				}
			});
        }
		

        // 切换设置下拉菜单
        function toggleSettingsDropdown() {
            const dropdown = document.getElementById('settingsDropdown');
            dropdown.classList.toggle('show');
        }
        
        // 关闭设置下拉菜单
        function closeSettingsDropdown() {
            document.getElementById('settingsDropdown').classList.remove('show');
        }
        
        // 切换导出下拉菜单
        function toggleExportDropdown() {
            const dropdown = document.getElementById('exportDropdown');
            dropdown.classList.toggle('show');
        }
        
        // 关闭导出下拉菜单
        function closeExportDropdown() {
            document.getElementById('exportDropdown').classList.remove('show');
        }
        

	window.wangEditor.Boot.registerMenu({
		  key: 'runjsbtn',
		  factory() {
			return {
				title:'▶RunJs',
				tag:"button",
				isActive:function(editor){return true;},
				isDisabled:function(editor){return false;},
				getValue:function(editor){return 1;},
				exec:function(editor, value){ runJs(); }
			}
		  }
	});
    window.wangEditor.Boot.registerMenu({
		  key: 'myMenu',
		  factory() {
			return {
				title:'源码模式',
				tag:"button",
				isActive:function(editor){return false;},
				isDisabled:function(editor){return false;},
				getValue:function(editor){return 1;},
				exec:function(editor, value){ toggleSourceMode(); }
			}
		  }
	});
	window.wangEditor.Boot.registerMenu({
		  key: 'savebtn',
		  factory() {
			return {
				title:'💾 保存',
				tag:"button",
				isActive:function(editor){return true;},
				isDisabled:function(editor){return false;},
				getValue:function(editor){return 1;},
				exec:function(editor, value){ saveCurrentNote(); }
			}
		  }
	});
        
        // 初始化WangEditor编辑器
        function initWangEditor() {
            const { createEditor, createToolbar } = window.wangEditor;
            
            editor = createEditor({
                selector: '#editor',
                html: '<p><br></p>',
                config: { 
                    scroll: false,
                    scrollTo: {
                       enable: false
                     },
                    placeholder: '开始编写您的记事本...',
                    onChange(editor) {
                        // 只有当内容真正发生变化时才标记为有未保存更改
                        updateSaveButton();
                    }
                }
            });
            const toolbar = createToolbar({
                editor,
                selector: '#editor-toolbar',
                config: {
                    excludeKeys: [
                       'group-video'
                    ],
                    // 添加自定义按钮
                     insertKeys: {
					  index: 999,
					  keys: ['|','runjsbtn','myMenu','savebtn'], // show menu in toolbar
					}
                }
            });
            
            // 设置默认为查看模式
            editor.disable();
            updateViewMode();
        }
        
        // 更新查看模式样式
        function updateViewMode() {
            const editorContainer = document.querySelector('.main-container');
            if (!isEditing) {
                editorContainer.classList.add('view-mode');
            } else {
                editorContainer.classList.remove('view-mode');
            }
        }
        
        // 更新日期时间显示
        function updateDateTime() {
            const now = new Date();
            const dateStr = now.toLocaleDateString('zh-CN', {
                year: 'numeric',
                month: 'long',
                day: 'numeric'
            });
            const weekStr = now.toLocaleDateString('zh-CN', { weekday: 'long' });
            const timeStr = now.toLocaleTimeString('zh-CN');
            document.getElementById('currentDate').textContent = `${dateStr} ${weekStr} ${timeStr}`;
        }
        
        // 切换主题
        function toggleTheme() {
            isDarkMode = !isDarkMode;
            if (isDarkMode) {
                document.body.classList.add('dark-mode');
                const themeBtn = document.querySelector('.dropdown-content a:first-child');
                if (themeBtn) {
                    themeBtn.innerHTML = '☀️ 白天模式';
                }
            } else {
                document.body.classList.remove('dark-mode');
                const themeBtn = document.querySelector('.dropdown-content a:first-child');
                if (themeBtn) {
                    themeBtn.innerHTML = '🌙 夜间模式';
                }
            }
            // 保存主题设置
            localStorage.setItem('notebookTheme', isDarkMode ? 'dark' : 'light');
            closeSettingsDropdown();
        }
        
        // 切换导航栏
        function toggleNav() {
            const container = document.getElementById('mainContainer');
            isNavCollapsed = !isNavCollapsed;
            if (isNavCollapsed) {
                container.classList.add('nav-hidden');
                document.querySelector('.toggle-nav').textContent = '▶';
            } else {
                container.classList.remove('nav-hidden');
                document.querySelector('.toggle-nav').textContent = '◀';
            }
        }
        
        // 切换编辑模式
        function toggleEditMode() {
            isEditing = !isEditing;
            const btn = document.getElementById('editToggleBtn');
            if (isEditing) {
                btn.textContent = '👁️';
                editor.enable();
            } else {
                btn.textContent = '📝';
                editor.disable();
            }
            updateViewMode();
        }
         
        
        // 切换源码模式
        function toggleSourceMode() {
            isSourceMode = !isSourceMode;
            const editorElement = document.getElementById('editor');
            const toolbarElement = document.getElementById('editor-toolbar');
            const sourceEditorElement = document.getElementById('source-editor');
            const sourceTextarea = document.getElementById('source-textarea');
            
            if (isSourceMode) {
                // 进入源码模式
                editorElement.style.display = 'none';
                toolbarElement.style.display = 'none';
                sourceEditorElement.style.display = 'flex';
                // 获取当前HTML内容并显示在textarea中
                sourceTextarea.value = editor.getHtml();
                sourceTextarea.focus();
            } else {
                // 退出源码模式
                editorElement.style.display = 'block';
                toolbarElement.style.display = 'block';
                sourceEditorElement.style.display = 'none';
            }
        }
        
        // 保存源码
        function saveSourceCode() {
            if (!currentNote) {
                showNotification('请先选择或创建记事本', 'error');
                return;
            }
            const sourceTextarea = document.getElementById('source-textarea');
            const htmlContent = sourceTextarea.value;
            editor.setHtml(htmlContent);
            saveCurrentNote();
            toggleSourceMode(); // 切换回编辑模式
        }
        
        // 取消源码模式
        function cancelSourceMode() {
            toggleSourceMode(); // 切换回编辑模式
        }
        
        // 显示通知
        function showNotification(message, type = 'success') {
            const notification = document.getElementById('notification');
            notification.textContent = message;
            notification.style.display = 'block';
            notification.style.background = type === 'error' ? '#f44336' : '#4CAF50';
            setTimeout(() => {
                notification.style.display = 'none';
            }, 3000);
        }
        
        // 添加默认分组
        function addDefaultGroup() {
            const store = getGroupStore(false);
            const group = { name: '默认分组', createdAt: new Date() };
            const request = store.add(group);
            request.onsuccess = function() {
                loadNotebookTree();
                showNotification('分组添加成功');
            };
            request.onerror = function() {
                showNotification('分组添加失败', 'error');
            };
        }
        
        // 显示添加分组模态框
        function showAddGroupModal() {
            document.getElementById('groupNameInput').value = '';
            document.getElementById('addGroupModal').style.display = 'block';
        }
        
        // 关闭模态框
        function closeModal(modalId) {
            document.getElementById(modalId).style.display = 'none';
        }
        
        // 添加分组
        function addGroup() {
            const groupName = document.getElementById('groupNameInput').value.trim();
            if (!groupName) {
                showNotification('请输入分组名称', 'error');
                return;
            }
            const store = getGroupStore(false);
            const group = { name: groupName, createdAt: new Date() };
            const request = store.add(group);
            request.onsuccess = function() {
                closeModal('addGroupModal');
                loadNotebookTree();
                showNotification('分组添加成功');
            };
            request.onerror = function() {
                showNotification('分组添加失败', 'error');
            };
        }
        
        // 在分组中添加默认笔记本
        function addDefaultNoteToGroup(groupId) {
            const store = getNotesStore(false);
            const note = {
                title: '默认笔记本',
                groupId: groupId,
                content: '<p><br></p>',
                createdAt: new Date(),
                updatedAt: new Date()
            };
            const request = store.add(note);
            request.onsuccess = function() {
                loadNotebookTree();
                showNotification('笔记本添加成功');
                // 自动打开新创建的记事本
                setTimeout(() => {
                    openNote(request.result);
                    if (!isEditing) {
                        toggleEditMode();
                    }
                }, 100);
            };
            request.onerror = function() {
                showNotification('笔记本添加失败', 'error');
            };
        }
        
        // 切换分组折叠状态
        function toggleGroup(groupId) {
            groupStates[groupId] = !groupStates[groupId];
            localStorage.setItem('groupStates', JSON.stringify(groupStates));
            loadNotebookTree();
        }
        
        // 加载笔记本树形结构（按名称排序）
        function loadNotebookTree() {
            const navContent = document.getElementById('navContent');
            navContent.innerHTML = '<div style="text-align: center; padding: 20px; color: #666;">加载中...</div>';
            const groupsStore = getGroupStore(true);
            const groupsRequest = groupsStore.getAll();
            groupsRequest.onsuccess = function() {
                let groups = groupsRequest.result;
                // 按名称排序
                groups.sort((a, b) => a.name.localeCompare(b.name, 'zh-CN'));
                const notesStore =  getNotesStore(true);
                const notesRequest = notesStore.getAll();
                notesRequest.onsuccess = function() {
                    let notes = notesRequest.result;
                    // 按标题排序
                    notes.sort((a, b) => a.title.localeCompare(b.title, 'zh-CN'));
                    renderNotebookTree(groups, notes);
                };
                notesRequest.onerror = function() {
                    navContent.innerHTML = '<div style="text-align: center; padding: 20px; color: #f44336;">加载失败</div>';
                };
            };
            groupsRequest.onerror = function() {
                navContent.innerHTML = '<div style="text-align: center; padding: 20px; color: #f44336;">加载失败</div>';
            };
        }
        
        // 渲染笔记本树形结构
        function renderNotebookTree(groups, notes) {
            const navContent = document.getElementById('navContent');
            navContent.innerHTML = '';
            // 先显示未分组的记事本
            const ungroupedNotes = notes.filter(note => !note.groupId);
            if (ungroupedNotes.length > 0) {
                const ungroupedDiv = document.createElement('div');
                ungroupedDiv.className = 'tree-node group-node';
                ungroupedDiv.innerHTML = '📁 未分组';
                ungroupedDiv.dataset.groupId = 'ungrouped';
                // 添加拖拽事件
                ungroupedDiv.addEventListener('dragover', handleDragOver);
                ungroupedDiv.addEventListener('dragleave', handleDragLeave);
                ungroupedDiv.addEventListener('drop', function(e) {
                    handleDrop(e, null);
                });
                // 双击重命名
                ungroupedDiv.ondblclick = function(e) {
                    if (e.target === ungroupedDiv) {
                        startRename(ungroupedDiv, 'group', '未分组');
                    }
                };
                navContent.appendChild(ungroupedDiv);
                ungroupedNotes.forEach(note => {
                    const noteNode = createNoteNode(note);
                    navContent.appendChild(noteNode);
                });
            }
            // 显示分组及其记事本
            groups.forEach(group => {
                const isCollapsed = groupStates[group.id] || false;
                const groupDiv = document.createElement('div');
                groupDiv.className = 'tree-node group-node';
                groupDiv.innerHTML = `
                    <span class="group-toggle">${isCollapsed ? '▶' : '▼'}</span>
                    📁 ${group.name}
                `;
                groupDiv.dataset.groupId = group.id;
                groupDiv.dataset.groupName = group.name;
                // 处理单击和双击事件
                groupDiv.onclick = function(e) {
                    const isToggleIcon = e.target.classList.contains('group-toggle');
                    if (isToggleIcon)toggleGroup(group.id);
                };
                groupDiv.ondblclick = function(e) {e.stopPropagation();
                    const isToggleIcon = e.target.classList.contains('group-toggle');
                    if (!isToggleIcon)startRename(groupDiv, 'group', groupDiv.dataset.groupName, group.id);
                };
                // 添加拖拽事件
                groupDiv.addEventListener('dragover', handleDragOver);
                groupDiv.addEventListener('dragleave', handleDragLeave);
                groupDiv.addEventListener('drop', function(e) {
                    handleDrop(e, group.id);
                });
                // 添加分组操作按钮
                const actionsDiv = document.createElement('div');
                actionsDiv.className = 'node-actions';
                const addNoteBtn = document.createElement('button');
                addNoteBtn.className = 'node-action-btn add-note-btn';
                addNoteBtn.innerHTML = '➕';
                addNoteBtn.title = '添加笔记本';
                addNoteBtn.onclick = function(e) {
                    e.stopPropagation();
                    addDefaultNoteToGroup(group.id);
                };
                const deleteBtn = document.createElement('button');
                deleteBtn.className = 'node-action-btn delete-btn';
                deleteBtn.innerHTML = '🗑️';
                deleteBtn.title = '删除分组';
                deleteBtn.onclick = function(e) {
                    e.stopPropagation();
                    showDeleteConfirm('group', group.id, group.name);
                };
                actionsDiv.appendChild(addNoteBtn);
                actionsDiv.appendChild(deleteBtn);
                groupDiv.appendChild(actionsDiv);
                navContent.appendChild(groupDiv);
                // 只有在分组展开时才显示其中的笔记
                if (!isCollapsed) {
                    const groupedNotes = notes.filter(note => note.groupId === group.id);
                    groupedNotes.forEach(note => {
                        const noteNode = createNoteNode(note);
                        navContent.appendChild(noteNode);
                    });
                }
            });
            // 如果没有任何数据，显示提示
            if (groups.length === 0 && notes.length === 0) {
                navContent.innerHTML = '<div style="text-align: center; padding: 20px; color: #666;">暂无数据<br>点击下方 + 按钮添加分组</div>';
            }
        }
        
		let noteDblFlag=false;
        // 创建记事本节点
        function createNoteNode(note) {
            const noteNode = document.createElement('div');
            noteNode.className = 'tree-node note-node';
            noteNode.innerHTML = `📝 ${note.title}`;
            noteNode.dataset.noteId = note.id;
            noteNode.dataset.groupId = note.groupId || 'null';
            noteNode.draggable = true;
            // 添加拖拽事件
            noteNode.addEventListener('dragstart', handleDragStart);
            noteNode.onclick =function(){
				if(event.target.nodeName=="INPUT")return ;
				noteDblFlag=false;
				setTimeout(function(){
					if(!noteDblFlag)handleNoteClick(note.id);
				},50);
			}
            if (currentNote && currentNote.id === note.id) {
                noteNode.classList.add('active');
            }
            // 双击重命名
            noteNode.ondblclick = function(e) {
				noteDblFlag=true;
                e.stopPropagation();
                startRename(noteNode, 'note', note.title, note.id);
            };
            // 添加记事本操作按钮
            const actionsDiv = document.createElement('div');
            actionsDiv.className = 'node-actions';
            const deleteBtn = document.createElement('button');
            deleteBtn.className = 'node-action-btn delete-btn';
            deleteBtn.innerHTML = '🗑️';
            deleteBtn.title = '删除笔记本';
            deleteBtn.onclick = function(e) {
                e.stopPropagation();
                showDeleteConfirm('note', note.id, note.title);
            };
            actionsDiv.appendChild(deleteBtn);
            noteNode.appendChild(actionsDiv);
            return noteNode;
        }
        
        // 开始重命名
        function startRename(node, type, currentName, id) {
            if (renamingNode) {
                finishRename(1);
            }
            renamingNode = { node, type, id, originalName: currentName };
            const input = document.createElement('input');
            input.type = 'text';
            input.className = 'rename-input';
            input.value = currentName;
            input.dataset.renameType = type;
            input.dataset.renameId = id;
            input.onkeydown = function(e) {
                if (e.key === 'Enter') {
                    finishRename(2);
                } else if (e.key === 'Escape') {
                    cancelRename(2);
                }
            };
            input.onblur = finishRename;
            node.innerHTML = '';
            node.appendChild(input);
            input.focus();
            input.select();
        }
        
        // 完成重命名
        function finishRename(t) {
            if (!renamingNode) return;
            const input = renamingNode.node.querySelector('.rename-input');
            if (!input) {
                cancelRename(1);
                return;
            }
            const newName = input.value.trim();
            if (!newName || newName === renamingNode.originalName) {
                cancelRename(3);
                return;
            }
            if (renamingNode.type === 'group') {
                updateGroupName(renamingNode.id, newName);
            } else {
                updateNoteName(renamingNode.id, newName);
            }
            renamingNode = null;
        }
        
        // 取消重命名
        function cancelRename(t) {
            if (!renamingNode) return;
            if (renamingNode.type === 'group') {
                if (renamingNode.originalName === '未分组') {
                    renamingNode.node.innerHTML = '📁 未分组';
                } else {
                    const groupId = renamingNode.id;
                    const isCollapsed = groupStates[groupId] || false;
                    renamingNode.node.innerHTML = `
                        <span class="group-toggle">${isCollapsed ? '▶' : '▼'}</span>
                        📁 ${renamingNode.originalName}
                    `;
                }
            } else {
                renamingNode.node.innerHTML = `📝 ${renamingNode.originalName}`;
            }
            if (renamingNode.type === 'group') {
                const actionsDiv = document.createElement('div');
                actionsDiv.className = 'node-actions';
                const addNoteBtn = document.createElement('button');
                addNoteBtn.className = 'node-action-btn add-note-btn';
                addNoteBtn.innerHTML = '➕';
                addNoteBtn.onclick = function(e) {
                    e.stopPropagation();
                    addDefaultNoteToGroup(renamingNode.id);
                };
                const deleteBtn = document.createElement('button');
                deleteBtn.className = 'node-action-btn delete-btn';
                deleteBtn.innerHTML = '🗑️';
                deleteBtn.onclick = function(e) {
                    e.stopPropagation();
                    showDeleteConfirm('group', renamingNode.id, renamingNode.originalName);
                };
                actionsDiv.appendChild(addNoteBtn);
                actionsDiv.appendChild(deleteBtn);
                renamingNode.node.appendChild(actionsDiv);
            } else {
                const actionsDiv = document.createElement('div');
                actionsDiv.className = 'node-actions';
                const deleteBtn = document.createElement('button');
                deleteBtn.className = 'node-action-btn delete-btn';
                deleteBtn.innerHTML = '🗑️';
                deleteBtn.onclick = function(e) {
                    e.stopPropagation();
                    showDeleteConfirm('note', renamingNode.id, renamingNode.originalName);
                };
                actionsDiv.appendChild(deleteBtn);
                renamingNode.node.appendChild(actionsDiv);
            }
            renamingNode = null;
        }
        
        // 更新分组名称
        function updateGroupName(groupId, newName) {
            const store = getGroupStore(false);
            const request = store.get(groupId);
            request.onsuccess = function() {
                const group = request.result;
                if (group) {
                    group.name = newName;
                    group.updatedAt = new Date();
                    const updateRequest = store.put(group);
                    updateRequest.onsuccess = function() {
                        loadNotebookTree();
                        showNotification('分组重命名成功');
                    };
                    updateRequest.onerror = function() {
                        showNotification('分组重命名失败', 'error');
                    };
                }
            };
            request.onerror = function() {
                showNotification('获取分组信息失败', 'error');
            };
        }
        
        // 更新记事本名称
        function updateNoteName(noteId, newName) {
            const store =  getNotesStore(false);
            const request = store.get(noteId);
            request.onsuccess = function() {
                const note = request.result;
                if (note) {
                    note.title = newName;
                    note.updatedAt = new Date();
                    const updateRequest = store.put(note);
                    updateRequest.onsuccess = function() {
                        if (currentNote && currentNote.id === noteId) {
                            document.getElementById('currentNoteTitle').textContent = newName;
                            currentNote.title = newName;
                        }
                        loadNotebookTree();
                        showNotification('记事本重命名成功');
                    };
                    updateRequest.onerror = function() {
                        showNotification('记事本重命名失败', 'error');
                    };
                }
            };
            request.onerror = function() {
                showNotification('获取记事本信息失败', 'error');
            };
        }
        
        // 拖拽开始
        function handleDragStart(e) {
            e.dataTransfer.setData('text/plain', e.target.dataset.noteId);
            e.target.style.opacity = '0.5';
        }
        
        // 拖拽经过
        function handleDragOver(e) {
            e.preventDefault();
            e.currentTarget.classList.add('drag-over');
        }
        
        // 拖拽离开
        function handleDragLeave(e) {
            e.currentTarget.classList.remove('drag-over');
        }
        
        // 拖拽放置
        function handleDrop(e) {
            e.preventDefault();
            e.currentTarget.classList.remove('drag-over');
            const noteId = e.dataTransfer.getData('text/plain');
            const targetGroupId = e.currentTarget.dataset.groupId === 'ungrouped' ? null : 
                                 (e.currentTarget.dataset.groupId ? parseInt(e.currentTarget.dataset.groupId) : null);
            if (noteId) {
                moveNoteToGroup(parseInt(noteId), targetGroupId);
            }
        }
        
        // 移动记事本到分组
        function moveNoteToGroup(noteId, groupId) {
            const store =  getNotesStore(false);
            const request = store.get(noteId);
            request.onsuccess = function() {
                const note = request.result;
                if (note) {
                    note.groupId = groupId;
                    note.updatedAt = new Date();
                    const updateRequest = store.put(note);
                    updateRequest.onsuccess = function() {
                        loadNotebookTree();
                        showNotification('记事本移动成功');
                        if (currentNote && currentNote.id === noteId) {
                            currentNote.groupId = groupId;
                        }
                    };
                    updateRequest.onerror = function() {
                        showNotification('记事本移动失败', 'error');
                    };
                }
            };
            request.onerror = function() {
                showNotification('获取记事本信息失败', 'error');
            };
        }
        
        // 显示删除确认
        function showDeleteConfirm(type, id, name) {
            deletePending = { type, id, name };
            const message = type === 'group' ? 
                `确定要删除分组 "${name}" 吗？注意：删除分组不会删除其中的记事本，记事本将移至未分组。` :
                `确定要删除记事本 "${name}" 吗？此操作不可撤销。`;
            document.getElementById('deleteMessage').textContent = message;
            document.getElementById('deleteConfirmModal').style.display = 'block';
        }
        
        // 确认删除
        function confirmDelete() {
            if (!deletePending) return;
            const { type, id, name } = deletePending;
            if (type === 'group') {
                deleteGroup(id);
            } else {
                deleteNote(id);
            }
            closeModal('deleteConfirmModal');
            deletePending = null;
        }
        
        // 删除分组
        function deleteGroup(groupId) {
            const store =  getNotesStore(true);
            const index = store.index('groupId');
            const request = index.getAll(groupId);
            request.onsuccess = function() {
                const notesInGroup = request.result;
                if (notesInGroup.length > 0) {
                    showNotification('分组下有记事本，不能直接删除', 'error');
                    return;
                }
                const deleteStore = getGroupStore(false);
                const deleteRequest = deleteStore.delete(groupId);
                deleteRequest.onsuccess = function() {
                    // 删除分组状态记录
                    delete groupStates[groupId];
                    localStorage.setItem('groupStates', JSON.stringify(groupStates));
                    loadNotebookTree();
                    showNotification('分组删除成功');
                };
                deleteRequest.onerror = function() {
                    showNotification('分组删除失败', 'error');
                };
            };
            request.onerror = function() {
                showNotification('检查分组内容失败', 'error');
            };
        }
        
        // 删除记事本
        function deleteNote(noteId) {
            const store =  getNotesStore(false);
            const request = store.delete(noteId);
            request.onsuccess = function() {
                if (currentNote && currentNote.id === noteId) {
                    currentNote = null;
                    document.getElementById('currentNoteTitle').textContent = '请选择或创建记事本';
                    editor.setHtml('<p><br></p>');
                    localStorage.removeItem('lastActiveNoteId');
                }
                loadNotebookTree();
                showNotification('记事本删除成功');
            };
            request.onerror = function() {
                showNotification('记事本删除失败', 'error');
            };
        }
        
        // 处理记事本点击
        function handleNoteClick(noteId) {
            if (initialContent != editor.getHtml() && currentNote && currentNote.id !== noteId) {
                pendingNavigation = noteId;
                document.getElementById('confirmSaveModal').style.display = 'block';
            } else {
                openNote(noteId);
            }
        }

        // 更新保存按钮状态
        function updateSaveButton() {
        }
        
        // 保存当前记事本
        function saveCurrentNote() {
            if (!currentNote) {
                showNotification('请先选择或创建记事本', 'error');
                return;
            }
            const content = editor.getHtml();
            currentNote.content = content;
            currentNote.updatedAt = new Date();
            const store = getNotesStore(false);
            const request = store.put(currentNote);
            request.onsuccess = function() {
                // 更新初始内容
                initialContent = content;
                updateSaveButton();
                showNotification('保存成功！');
            };
            request.onerror = function() {
                showNotification('保存失败', 'error');
            };
        }
        
        // 不保存更改
        function discardChanges() {
            closeModal('confirmSaveModal');
            if (pendingNavigation) {
                openNote(pendingNavigation);
                pendingNavigation = null;
            }
        }
        
        // 保存并继续
        function saveAndContinue() {
            if (currentNote) {
                saveCurrentNote();
            }
            closeModal('confirmSaveModal');
            setTimeout(() => {
                if (pendingNavigation) {
                    openNote(pendingNavigation);
                    pendingNavigation = null;
                }
            }, 300);
        }

        // 备份数据
        function backupData() {
            const exportObj = {
                groups: [],
                notes: [],
                exportDate: new Date().toISOString()
            };
            const groupsStore = getGroupStore(true);;
            const groupsRequest = groupsStore.getAll();
            groupsRequest.onsuccess = function() {
                exportObj.groups = groupsRequest.result;
                const notesStore =  getNotesStore(true);
                const notesRequest = notesStore.getAll();
                notesRequest.onsuccess = function() {
                    exportObj.notes = notesRequest.result;

                    const dataBlob = new Blob([dataStr], { type: 'application/json' });
                    const url = URL.createObjectURL(dataBlob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = `notebook_backup_${new Date().toISOString().slice(0, 10)}.json`;
                    a.click();
                    URL.revokeObjectURL(url);
                    showNotification('数据备份成功');
                };
                notesRequest.onerror = function() {
                    showNotification('数据备份失败', 'error');
                };
            };
            groupsRequest.onerror = function() {
                showNotification('数据备份失败', 'error');
            };
            closeSettingsDropdown();
        }
        
        // 恢复数据
        function restoreLocalData() {
            const input = document.createElement('input');
            input.type = 'file';
            input.accept = '.json';
            input.onchange = function(event) {
                const file = event.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = function(e) {
                    try {
                        const importedData = JSON.parse(e.target.result);
                        window.importedData = importedData;
                        document.getElementById('importConfirmModal').style.display = 'block';
                    } catch (error) {
                        showNotification('文件格式错误', 'error');
                    }
                };
                reader.readAsText(file);
            };
            input.click();
            closeSettingsDropdown();
        } 
        
        // 合并导入数据
        function importWithMerge() {
            performImport('merge');
        }
        
        // 替换导入数据
        function importWithReplace() {
            performImport('replace');
        }
        
        // 执行导入操作
        function performImport(mode) {
            const importedData = window.importedData;
            closeModal('importConfirmModal');
            if (mode === 'replace') {
                const clearGroups = getGroupStore(false).clear();
                clearGroups.onsuccess = function() {
                    const clearNotes =  getNotesStore(false).clear();
                    clearNotes.onsuccess = function() {
                        insertImportedData(importedData, mode);
                    };
                    clearNotes.onerror = function() {
                        showNotification('数据清理失败', 'error');
                    };
                };
                clearGroups.onerror = function() {
                    showNotification('数据清理失败', 'error');
                };
            } else {
                insertImportedData(importedData, mode);
            }
        }
        
        // 插入导入的数据
        function insertImportedData(data, mode) {
            try {
                const groupMap = new Map();
                const getGroupsRequest = getGroupStore(true).getAll();
                getGroupsRequest.onsuccess = function() {
                    const existingGroups = getGroupsRequest.result;
                    const existingGroupNames = new Set(existingGroups.map(g => g.name));
                    const groupsStore = getGroupStore(false);
                    let groupInsertCount = 0;
                    const totalGroups = data.groups.length;
                    if (totalGroups === 0) {
                        processNotes();
                        return;
                    }
                    data.groups.forEach((group, index) => {
                        let groupName = group.name;
                        if (mode === 'merge' && existingGroupNames.has(groupName)) {
                            groupName = `${groupName}(导入)`;
                        }
                        const newGroup = {
                            name: groupName,
                            createdAt: group.createdAt || new Date(),
                            updatedAt: group.updatedAt || new Date()
                        };
                        const addRequest = groupsStore.add(newGroup);
                        addRequest.onsuccess = function(e) {
                            groupMap.set(group.id, e.target.result);
                            groupInsertCount++;
                            if (groupInsertCount === totalGroups) {
                                processNotes();
                            }
                        };
                        addRequest.onerror = function() {
                            showNotification('分组导入失败', 'error');
                        };
                    });
                    function processNotes() {
                        const getNotesRequest =  getNotesStore(true).getAll();
                        getNotesRequest.onsuccess = function() {
                            const existingNotes = getNotesRequest.result;
                            const existingNoteTitles = new Set(existingNotes.map(n => n.title));
                            const notesStore =  getNotesStore(false);
                            let noteInsertCount = 0;
                            const totalNotes = data.notes.length;
                            if (totalNotes === 0) {
                                getNotesRequest.transaction.oncomplete = function() {
                                    loadNotebookTree();
                                    showNotification('数据恢复成功');
                                };
                                return;
                            }
                            data.notes.forEach(note => {
                                let noteTitle = note.title;
                                let noteGroupId = note.groupId ? groupMap.get(note.groupId) : null;
                                if (mode === 'merge' && existingNoteTitles.has(noteTitle)) {
                                    noteTitle = `${noteTitle}(导入)`;
                                }
                                const newNote = {
                                    title: noteTitle,
                                    groupId: noteGroupId,
                                    content: note.content || '<p><br></p>',
                                    createdAt: note.createdAt || new Date(),
                                    updatedAt: note.updatedAt || new Date()
                                };
                                const addNoteRequest = notesStore.add(newNote);
                                addNoteRequest.onsuccess = function() {
                                    noteInsertCount++;
                                    if (noteInsertCount === totalNotes) {
                                        getNotesRequest.transaction.oncomplete = function() {
                                            loadNotebookTree();
                                            showNotification('数据恢复成功');
                                        };
                                    }
                                };
                                addNoteRequest.onerror = function() {
                                    showNotification('笔记导入失败', 'error');
                                };
                            });
                        };
                        getNotesRequest.onerror = function() {
                            showNotification('获取现有笔记失败', 'error');
                        };
                    }
                };
                getGroupsRequest.onerror = function() {
                    showNotification('数据恢复失败', 'error');
                };
            } catch (error) {
                console.error('数据导入错误:', error);
                showNotification('数据恢复失败', 'error');
            }
        }

				let iframeJson=null;
				try{
					iframeJson=JSON.parse(text);
				}catch(e){
					try{eval("iframeJson="+text);}catch(e2){}
				}
				if(iframeJson && iframeJson.src){
					let ifm=iframes[node.id];
					if(!ifm){

						ifm.src=iframeJson.src;
						document.querySelector(".mainiframe").appendChild(ifm);

						ifm.style.display='';
					}
					
				}
			}
		}
		
		function runJs(){
			try{
				let jsStr="";
				const selection = window.getSelection();
				if (selection.rangeCount === 0) return ;
				const range = selection.getRangeAt(0);
				if (!range.startContainer) return ;
				let sNode=range.startContainer;
				let codeNode=null;
				for(let i=0;i<100;i++){
					if(sNode.nodeName=="CODE")codeNode=sNode;
					else sNode=sNode.parentElement;
				}
				if(!codeNode) return ;
				
				jsStr=getJsText(codeNode.id);
				
				if(jsStr)eval(`(async () => {try{ \n ${jsStr} \n }catch(e){\n alert(e.message);\n console.error(e);\n} })()`);
				else alert("未找到相关的JS代码");
			}catch(e){
				alert(e.message);
				console.error(e);
			}
		}
		
		
		function getJsText(codeId){
			let codes=editor.getElemsByType("code");
			for(let i=0;i<codes.length;i++){
				let codeTmp=codes[i];
				if(codeTmp.id==codeId && codeTmp.language.endsWith("script") &&codeTmp.children.length>0){
					return codeTmp.children[0].text;
				}
			}
			return null;

		}

		let keymode=false,laseScroll=0,sc=document.querySelector(".w-e-scroll");
		(function initScrollEvent(){
			sc=document.querySelector(".w-e-scroll");
			if(sc){
				sc.onscroll=function (e) {
					if(keymode) sc.scrollTop=laseScroll;
				}
				document.onkeydown=function(e){ 
					try{
						laseScroll= sc.scrollTop;
						keymode=true;
						const gbwzy=window.getSelection().getRangeAt(0).cloneRange().getBoundingClientRect().top;  
						if(gbwzy==0)return ;
						if(gbwzy >= sc.getBoundingClientRect().bottom )keymode=false;
						if(gbwzy<=sc.getBoundingClientRect().top )keymode=false;
					}catch(e){ console.error(e);}
				}
				document.onmousedown=function(e){  keymode=false; }
				document.onwheel=function(e){ keymode=false; }
				console.log("initScrollEvent success");
			}else{
				setTimeout(initScrollEvent,300);
			}
		})();
